[project]
name = "pitwall-ml"
version = "0.1.0"
description = "PitWall ML — Real-Time F1 Race Intelligence with Continual Learning, Probabilistic Forecasting and Production MLOps"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "polars>=1.10",
    "pyarrow>=16",
    "duckdb>=1.0",
    "httpx>=0.27",
    "websockets>=12",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "mlflow>=2.13",
    "prometheus-client>=0.20",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "types-pyyaml",
    "types-redis",
]
ml = [
    "fastf1>=3.4",
    "shap>=0.45",
    "evidently>=0.4.30",
    "catboost>=1.2",
    "xgboost>=2.1",
    "scikit-survival>=0.23",
]

[project.scripts]
pitwall = "pitwall.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitwall", "apps/api/pitwall_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["src"]
