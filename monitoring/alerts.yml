groups:
  - name: pitwall
    rules:
      - alert: HighInferenceLatency
        expr: histogram_quantile(0.95, rate(inference_duration_seconds_bucket[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "API p95 inference >100ms" }

      - alert: EventProcessingLag
        expr: event_processing_lag_seconds > 5
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "Event processing lag >5s — live mode degraded" }

      - alert: FeatureStale
        expr: feature_freshness_seconds > 10
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Feature freshness >10s" }

      - alert: PaceMAERegression
        expr: pace_mae_seconds > 2.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Pace MAE >2.5s — model regression (warning threshold, real-data calibrated)" }

      - alert: PaceMAERegressionCritical
        expr: pace_mae_seconds > 3.5
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "Pace MAE >3.5s — model critical regression (real-data calibrated)" }

      - alert: DriftingFeaturesHigh
        expr: drifting_features_ratio > 0.2
        for: 5m
        labels: { severity: warning }
        annotations: { summary: " >20% features drifting (Evidently 3-race window)" }

      - alert: IntervalCoverageLow
        expr: pace_interval_coverage < 0.72 or pace_interval_coverage > 0.88
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "80% interval coverage outside 72-88% (miscalibrated, real-data tolerance)" }

      - alert: PitAucRegression
        expr: pit_auc < 0.65
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Pit AUC <0.65 — hazard model degraded" }

      - alert: WassersteinDriftHigh
        expr: feature_wasserstein_distance > 1.5
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Wasserstein distance >1.5 — feature drift high (2025->2026 era)" }

      - alert: PSIDriftSevere
        expr: feature_psi > 0.25
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "PSI >0.25 — severe population shift (2025->2026 era)" }

      - alert: ModelSubgroupRegression
        expr: subgroup_hard_mae_seconds > 5.0
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Hard compound MAE >5.0s — subgroup regression" }
