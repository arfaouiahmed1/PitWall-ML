name: Weekly Ingest & Retrain

on:
  schedule:
    # Every Monday 03:00 UTC — after race weekend data is settled
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: "Season to ingest (default: current)"
        required: false
        default: "2025"
      max_rows:
        description: "Max rows for training (0 = unlimited)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: retrain
  cancel-in-progress: false   # never cancel a running retrain mid-fit

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      new_sessions: ${{ steps.ingest.outputs.new_sessions }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ingest latest OpenF1 sessions
        id: ingest
        env:
          OPENF1_API_KEY: ${{ secrets.OPENF1_API_KEY }}
        run: |
          SEASON=${{ github.event.inputs.season || '2025' }}
          python -m pitwall.ingest.cli --season $SEASON --output-dir data/bronze
          echo "new_sessions=$(python -c "import json,pathlib; files=list(pathlib.Path('data/bronze').rglob('*.parquet')); print(len(files))")" >> $GITHUB_OUTPUT

      - name: Cache bronze data
        uses: actions/cache/save@v4
        with:
          path: data/bronze
          key: bronze-${{ github.run_id }}

  retrain:
    needs: ingest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Restore bronze data
        uses: actions/cache/restore@v4
        with:
          path: data/bronze
          key: bronze-${{ github.run_id }}

      - name: Build silver feature store
        run: python -m pitwall.data.silver --bronze-path data/bronze --output-dir data/silver

      - name: Train candidate model
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MAX_ROWS: ${{ github.event.inputs.max_rows || '0' }}
        run: |
          MAX_FLAG=""
          if [ "$MAX_ROWS" != "0" ]; then MAX_FLAG="--max-rows $MAX_ROWS"; fi
          python -m pipelines.train \
            --config configs/production.yaml \
            --output-dir artifacts/candidate \
            $MAX_FLAG

      - name: Run ablation study
        run: python -m pipelines.ablation --config configs/production.yaml

      - name: Check promotion gate
        id: gate
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("artifacts/candidate/metrics.json"))
          mae = m.get("mae", 99)
          cov = m.get("coverage_80_calibrated", m.get("coverage_80", 0))
          hard = m.get("per_compound", {}).get("HARD", 99)
          ok = mae < 2.0 and 0.78 <= cov <= 0.92 and hard < 6.0
          print(f"MAE={mae:.3f} Coverage={cov:.3f} HardMAE={hard:.3f} promote={ok}")
          with open("artifacts/candidate/gate.json", "w") as f:
              json.dump({"promote": ok, "mae": mae, "coverage": cov, "hard_mae": hard}, f)
          sys.exit(0 if ok else 1)
          EOF
        continue-on-error: true

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ github.run_id }}
          path: |
            artifacts/candidate/
            artifacts/ablation/
          retention-days: 30

      - name: Commit promoted model metrics [if gate passed]
        if: steps.gate.outcome == 'success'
        run: |
          cp artifacts/candidate/metrics.json artifacts/candidate_smoke/metrics.json
          cp artifacts/ablation/feature_ablation.json artifacts/ablation/feature_ablation.json
          git config user.name "pitwall-bot"
          git config user.email "bot@pitwall.ml"
          git add artifacts/candidate_smoke/metrics.json artifacts/ablation/
          git diff --staged --quiet || git commit -m "mlops: promote candidate ${{ github.run_id }} [skip ci]"
          git push
