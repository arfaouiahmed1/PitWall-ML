name: Publish API image to GHCR

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "apps/api/**"
      - "pyproject.toml"
      - "Dockerfile"
      - "pipelines/**"
      - "configs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-api
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pitwall-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}

      # Optional: trigger Render deploy hook if you use Render.
      # Set RENDER_DEPLOY_HOOK_URL secret to your service's deploy hook.
      # - name: Trigger Render deploy
      #   if: secrets.RENDER_DEPLOY_HOOK_URL != ''
      #   run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
