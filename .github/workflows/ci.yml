name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (editable)
        run: pip install -e ".[dev]"
      - name: Lint (ruff check)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Type check (mypy — allowed to warn)
        run: mypy src apps/api --ignore-missing-imports || true
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Leakage tests (no time-leakage)
        run: pytest tests/leakage -q
      - name: Integration + replay tests
        run: pytest tests/integration tests/replay -q
      - name: Validate compose
        run: docker compose config >/dev/null && echo "compose ok"
      - name: Training smoke test (synthetic fallback, no network)
        run: python -m pipelines.train --config configs/development.yaml --max-rows 2000 --output-dir artifacts/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-artifacts-${{ github.run_id }}
          path: artifacts/smoke/
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint || true
      # Validate both normal (SSR) and Pages (static export) builds
      - name: Build — normal (no basePath)
        run: npm run build
      - name: Build — static export (GitHub Pages)
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: pitwall-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke — compose build check
        run: docker compose config --images
