name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci || npm install

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          GITHUB_PAGES: "true"
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          # Point client-side fetches at the deployed FastAPI on Render / Railway.
          # Set this secret in repo Settings → Secrets → Actions.
          NEXT_PUBLIC_API_URL: ${{ secrets.PITWALL_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.PITWALL_WS_URL }}

      # GitHub Pages requires a .nojekyll file to serve files starting with _
      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
